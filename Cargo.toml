[workspace]
resolver = "3"
members = [
    "crates/gameclip-core",
    "crates/gameclip-protocol",
    "crates/gameclip-gpu",
    "crates/gameclip-media",
    "crates/gameclip-testsupport",
    "crates/gameclip-capture-win",
    "crates/gameclipd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Poldion/GameClip"

[workspace.dependencies]
gameclip-core = { path = "crates/gameclip-core" }
gameclip-protocol = { path = "crates/gameclip-protocol" }
gameclip-gpu = { path = "crates/gameclip-gpu" }
gameclip-testsupport = { path = "crates/gameclip-testsupport" }
gameclip-media = { path = "crates/gameclip-media" }
gameclip-capture-win = { path = "crates/gameclip-capture-win" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["local-offset", "formatting", "parsing", "serde", "macros"] }
thiserror = "2"
bitflags = { version = "2", features = ["serde"] }
ts-rs = { version = "11", features = ["uuid-impl", "serde-compat", "serde-json-impl"] }
# Jedes Crate nennt nur die Module, die es nutzt.
windows = "0.62"
windows-core = "0.62"
# Blockierendes `join()` für WinRT-IAsyncOperation (z. B. RequestAccessAsync).
windows-future = "0.3"
crossbeam-channel = "0.5"
wasapi = "0.26"
rubato = "5"
audioadapter-buffers = "5"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
# FFmpeg 8.1 (Feature ffmpeg8 ist Standard); Linken über .cargo/config.toml.
rsmpeg = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
# Gilt für alle Programme des Workspace: ein Absturz soll sofort enden,
# statt Threads halb weiterlaufen zu lassen (siehe Design, Datei 1).
panic = "abort"
