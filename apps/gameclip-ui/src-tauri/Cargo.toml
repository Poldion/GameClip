[package]
name = "gameclip-ui"
description = "Oberfläche von GameClip (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gameclip"
path = "src/main.rs"

[features]
# Bettet ../dist ein und lädt es über tauri://localhost. Ohne das Feature lädt die Exe devUrl
# (Vite auf localhost:1420) – `tauri build` setzt es selbst, ein reines `cargo build` nicht.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crossbeam-channel.workspace = true
gameclip-core.workspace = true
gameclip-protocol.workspace = true
gameclip-ui-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
