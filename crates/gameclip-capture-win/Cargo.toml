[package]
name = "gameclip-capture-win"
description = "Aufnahme unter Windows: WGC, Taktgeber, Videoweg bis zum Encoder (später WASAPI, Mixer, Ringpuffer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
crossbeam-channel.workspace = true
gameclip-gpu.workspace = true
gameclip-media.workspace = true
rsmpeg.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
windows-core.workspace = true
windows-future.workspace = true

# Tests laden die FFmpeg-DLLs aus third_party/ffmpeg/bin (muss in PATH stehen).
[dev-dependencies]
crossbeam-channel.workspace = true
gameclip-gpu.workspace = true
gameclip-media.workspace = true
rsmpeg.workspace = true
