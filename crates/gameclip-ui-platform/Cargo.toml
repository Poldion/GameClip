[package]
name = "gameclip-ui-platform"
description = "Windows-Aufrufe der GameClip-Oberfläche: Pipe-Client, Dienststart, Zwischenablage, Explorer, Vorschaubilder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel.workspace = true
drag = "2"
gameclip-core.workspace = true
gameclip-protocol.workspace = true
raw-window-handle = "0.6"
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows = { workspace = true, features = [
    "ApplicationModel",
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-collections = "0.3"
windows-core.workspace = true
windows-future.workspace = true

[dev-dependencies]
tempfile.workspace = true
