# Lizenzprüfung (Design, Datei 4): nur mit GPL-3.0 verträgliche Lizenzen.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
